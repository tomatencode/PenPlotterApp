[package]
name = "penplotterapp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penplotterapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.44"
mdns-sd = "0.13"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }

# Direct dependency for single-shot HTTP GETs. Pinned to the same 0.12 line that
# tauri-plugin-http already pulls in, so this reuses that build rather than
# adding a second copy of reqwest.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

